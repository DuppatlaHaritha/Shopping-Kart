name: pooja_app_new
description: Flutter frontend for Pooja Essentials e-commerce (connects to Spring Boot backend)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # 🌐 Networking and State Management
  http: ^1.2.0
  provider: ^6.1.1

  # 💳 Payment Integration
  razorpay_flutter: ^1.4.0

  # 🔗 External Links
  url_launcher: ^6.3.2

  # 🖼️ UI & Media Utilities
  carousel_slider: ^5.1.1
  file_picker: ^8.0.0

  # 🌍 Localization & Storage
  easy_localization: ^3.0.8
  shared_preferences: ^2.2.2  # ✅ Correct version, 2.5.3 doesn’t exist

  # 📦 Miscellaneous
  http_parser: any

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/ads/
    - assets/pooja_kart_logo.jpeg.png
    - assets/langs/
